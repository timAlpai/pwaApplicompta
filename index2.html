    
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicompta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ÉCRAN DE LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>Applicompta</h1>
            <p>Connectez-vous avec votre mot de passe d'application.</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Identifiant / Email</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe d'application</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Se connecter</button>
            </form>
            <p id="error-msg" class="error"></p>
        </div>
    </div>

   <!-- ÉCRAN PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-screen" class="screen" style="display:none; padding:0;">
        <!-- Le Header dynamique sera injecté ici -->
        <div id="dashboard-header"></div>
        
        <main style="padding: 20px;">
            <div id="content-area">
                <!-- Le reste du contenu -->
            </div>
        </main>
        
        <!-- MODAL D'ÉDITION (Caché par défaut) -->
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <h3>Mettre à jour les informations</h3>
                <form id="edit-form">
    <input type="hidden" id="edit-company-id">
    <input type="hidden" id="edit-company-name">  
    <!-- Champ caché pour le pays (on le gère en JS) -->
    

    <div class="form-group">
        <label>Adresse (Rue & N°)</label>
        <input type="text" id="edit-address" placeholder="Rue de la gare, 12">
    </div>
    
    <!-- NOUVEAU CHAMP -->
    <div class="form-group">
        <label>Complément (Apt, Suite, Boîte)</label>
        <input type="text" id="edit-address2" placeholder="Boîte 4">
    </div>

    <!-- NOUVEAUX CHAMPS SUR LA MÊME LIGNE -->
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>Code Postal</label>
            <input type="text" id="edit-zip" placeholder="7000">
        </div>
        <div class="form-group" style="flex: 2;">
            <label>Ville</label>
            <input type="text" id="edit-city" placeholder="Mons">
        </div>
    </div>

    <div class="form-group">
        <label>Province / État</label>
        <input type="text" id="edit-state" placeholder="Hainaut">
    </div>

    <div class="form-group">
        <label>Téléphone</label>
        <input type="text" id="edit-phone" placeholder="+32...">
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="edit-email" placeholder="contact@...">
    </div>
     <div class="form-group">
        <label>Pays</label>
        <select id="edit-country-id" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="">Chargement...</option>
        </select>
    </div>

    <!-- DEVISE (Nouveau) -->
    <div class="form-group">
        <label>Devise</label>
        <select id="edit-currency-id" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="">Chargement...</option>
        </select>
    </div>
    <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeEditModal()">Annuler</button>
        <button type="submit" class="btn-save">Enregistrer</button>
    </div>
</form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
